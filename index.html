<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding-top: 50px; min-height: 100vh; margin: 0; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; margin-bottom: 20px; }
        #chat-box { 
            background: white; padding: 24px; border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 500px; display: flex; flex-direction: column; max-height: 70vh; 
        }
        #chat-history {
            overflow-y: auto; padding: 10px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 15px; 
            min-height: 60px; max-height: 500px;
            border-bottom: 1px solid #eee; padding-bottom: 20px;
        }
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 16px;
            font-size: 15px; line-height: 1.5; word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background-color: #f1f3f5; color: #333; border-bottom-left-radius: 4px; }
        .input-group { display: flex; gap: 10px; }
        input { 
            flex: 1; padding: 14px 16px; border: 1px solid #dcdfe6; 
            border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.3s;
        }
        input:focus { border-color: #007bff; }
        button { 
            padding: 14px 24px; background: #007bff; color: white; border: none; 
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; 
            transition: all 0.3s; white-space: nowrap;
        }
        button:hover:not(:disabled) { background: #0056b3; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,123,255,0.3); }
        button:disabled { background-color: #cccccc !important; cursor: not-allowed; transform: none; box-shadow: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h1>🤖 我的 AI 助手</h1>
    <div id="chat-box">
        <div id="chat-history">
            <div class="message ai">你好！我是你的 AI 助手，有什么可以帮你的吗？</div>
        </div>
        <div class="input-group">
            <input type="text" id="question" placeholder="请输入你的问题..." onkeydown="if(event.key==='Enter') askAI()">
            <button id="send-btn" onclick="askAI()">发送</button>
        </div>
    </div>

    <script>
        function addMessage(text, sender) {
            const historyDiv = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerText = text;
            historyDiv.appendChild(messageDiv);
            historyDiv.scrollTop = historyDiv.scrollHeight;
            return messageDiv; // 返回这个元素，方便后面追加文字
        }

        async function askAI() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            const sendBtn = document.getElementById('send-btn');
            
            if (!question) { alert("请输入问题！"); return; }
            
            addMessage(question, 'user');
            questionInput.value = "";

            sendBtn.disabled = true;
            sendBtn.innerText = "思考中...";
            
            // 1. 先创建一个空的 AI 气泡，用来接收流式文字
            const aiMessageDiv = addMessage("", 'ai');
            
            try {
                // 2. 发起请求
                const res = await fetch(`http://127.0.0.1:8000/chat?question=${encodeURIComponent(question)}`);
                
                // 3. 获取读取器
                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                // 4. 循环读取数据流
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break; // 读完了就退出
                    
                    // 解码当前收到的片段
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    // 解析 SSE 格式的数据
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.replace('data: ', '').trim();
                            if (!jsonStr) continue;
                            try {
                                const data = JSON.parse(jsonStr);
                                // 把文字追加到气泡里
                                aiMessageDiv.innerText += data.content;
                                // 滚动到底部
                                const historyDiv = document.getElementById('chat-history');
                                historyDiv.scrollTop = historyDiv.scrollHeight;
                            } catch (e) {
                                console.error("解析JSON失败:", e);
                            }
                        }
                    }
                }
            } catch (error) {
                aiMessageDiv.innerText = "❌ 出错了，请确保后端服务正在运行。";
                aiMessageDiv.style.color = "red";
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "发送";
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
